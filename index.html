<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSHA 30 Payment Portal</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const PhishingSimulation = () => {
          const [cardNumber, setCardNumber] = React.useState('');
          const [cardType, setCardType] = React.useState('Unknown');
          const [expiry, setExpiry] = React.useState('');
          const [showModal, setShowModal] = React.useState(false);
          const [errorMessage, setErrorMessage] = React.useState('');

          // 1. Identify Card Network and dynamic length requirements
          const handleCardChange = (e) => {
            const value = e.target.value.replace(/\D/g, ''); // Strip non-digits
            setCardNumber(value);
            setErrorMessage(''); // Reset errors while typing

            if (value.startsWith('4')) {
              setCardType('Visa');
            } else if (/^5[1-5]/.test(value) || /^(222[1-9]|22[3-9]\d|2[3-6]\d{2}|27[0-1]\d|2720)/.test(value)) {
              setCardType('MasterCard');
            } else if (/^3[47]/.test(value)) {
              setCardType('American Express');
            } else if (/^6(?:011|5)/.test(value)) {
              setCardType('Discover');
            } else {
              setCardType('Unknown');
            }
          };

          // 2. Auto-insert slash for Expiry Date (MM/YY)
          const handleExpiryChange = (e) => {
            let value = e.target.value.replace(/\D/g, ''); // Strip non-digits
            
            if (value.length > 4) {
              value = value.slice(0, 4); // Limit to 4 digits total
            }

            if (value.length > 2) {
              // Auto-insert slash after the second digit
              value = `${value.slice(0, 2)}/${value.slice(2)}`;
            }

            setExpiry(value);
            setErrorMessage('');
          };

          // 3. Strict Form Validation on Submit
          const handleSubmit = (e) => {
            e.preventDefault();

            // Determine correct length based on card network
            const requiredLength = cardType === 'American Express' ? 15 : 16;

            if (cardNumber.length !== requiredLength) {
              setErrorMessage(`Invalid card number length. ${cardType === 'Unknown' ? 'Standard' : cardType} cards require exactly ${requiredLength} digits.`);
              return;
            }

            if (expiry.length < 5) {
              setErrorMessage('Please enter a valid expiry date (MM/YY).');
              return;
            }

            // If all requirements are met, intercept and trigger simulation response
            setShowModal(true);
          };

          return (
            <div style={styles.container}>
              <div style={styles.card}>
                <h2 style={{marginTop: 0}}>OSHA 30</h2>
                <p style={{fontSize: '14px', color: '#666'}}>Payment Portal</p>
                
                {errorMessage && (
                  <div style={styles.errorBanner}>{errorMessage}</div>
                )}

                <form onSubmit={handleSubmit} style={styles.form}>
                  <label style={styles.label}>Cardholder Name</label>
                  <input type="text" required style={styles.input} placeholder="Cardholder Name" />

                  <label style={styles.label}>Card Number</label>
                  <div style={styles.inputContainer}>
                    <input 
                      type="text" 
                      maxLength={cardType === 'American Express' ? "15" : "16"}
                      value={cardNumber}
                      onChange={handleCardChange}
                      required 
                      style={styles.input} 
                      placeholder={cardType === 'American Express' ? "3700 000000 00000" : "4111 1111 1111 1111"}
                    />
                    <span style={styles.badge}>{cardType}</span>
                  </div>

                  <div style={styles.row}>
                    <div>
                      <label style={styles.label}>Expiry Date</label>
                      <input 
                        type="text" 
                        placeholder="MM/YY" 
                        value={expiry}
                        onChange={handleExpiryChange}
                        required 
                        style={styles.input} 
                      />
                    </div>
                    <div>
                      <label style={styles.label}>CVV</label>
                      <input 
                        type="text" 
                        placeholder="123" 
                        maxLength={cardType === 'American Express' ? "4" : "3"} 
                        required 
                        style={styles.input} 
                      />
                    </div>
                  </div>

                  <button type="submit" style={styles.button}>Complete Payment</button>
                </form>
              </div>

              {showModal && (
                <div style={styles.overlay}>
                  <div style={styles.modal}>
                    <h3 style={styles.modalTitle}>⚠️ Security Awareness Notice</h3>
                    <p><strong>This was a simulated phishing test.</strong></p>
                    <p>If this had been a real adversarial attack, your payment information could have been compromised.</p>
                    <hr style={styles.divider} />
                    <h4>Key Indicators of Phishing to Watch For:</h4>
                    <ul style={styles.list}>
                      <li><strong>Unverified Senders:</strong> Always check the full email address or domain name in the URL bar.</li>
                      <li><strong>Urgent Language:</strong> Phishing often uses artificial urgency (e.g., "Pay within 24 hours to keep your account").</li>
                      <li><strong>Mismatched Domains:</strong> Legitimate payment processors use official, verified domains with correct certificates.</li>
                    </ul>
                    <button onClick={() => { setShowModal(false); setCardNumber(''); setExpiry(''); }} style={styles.closeButton}>
                      I Understand / Return to Training
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        };

        const styles = {
          container: { display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100vh', backgroundColor: '#f4f6f8', fontFamily: 'Arial, sans-serif' },
          card: { padding: '30px', borderRadius: '8px', backgroundColor: '#fff', boxShadow: '0 4px 12px rgba(0,0,0,0.1)', width: '400px' },
          form: { display: 'flex', flexDirection: 'column', marginTop: '10px' },
          errorBanner: { padding: '10px', backgroundColor: '#fde8e8', color: '#e53e3e', borderRadius: '4px', fontSize: '13px', marginBottom: '15px', border: '1px solid #f8b4b4' },
          label: { fontSize: '12px', fontWeight: 'bold', marginBottom: '5px', color: '#333' },
          inputContainer: { position: 'relative', display: 'flex', width: '100%' },
          input: { width: '100%', padding: '10px', marginBottom: '15px', borderRadius: '4px', border: '1px solid #ccc', boxSizing: 'border-box' },
          badge: { position: 'absolute', right: '10px', top: '10px', backgroundColor: '#0070ba', color: '#fff', padding: '2px 6px', borderRadius: '4px', fontSize: '12px' },
          row: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' },
          button: { padding: '12px', backgroundColor: '#0070ba', color: '#fff', border: 'none', borderRadius: '4px', cursor: 'pointer', fontWeight: 'bold', fontSize: '16px', marginTop: '10px' },
          overlay: { position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.7)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000 },
          modal: { backgroundColor: '#fff', padding: '30px', borderRadius: '8px', maxWidth: '500px', width: '90%', textAlign: 'left' },
          modalTitle: { color: '#d9534f', marginTop: 0 },
          divider: { border: '0', borderTop: '1px solid #eee', margin: '15px 0' },
          list: { paddingLeft: '20px', lineHeight: '1.6' },
          closeButton: { marginTop: '20px', padding: '10px 20px', backgroundColor: '#333', color: '#fff', border: 'none', borderRadius: '4px', cursor: 'pointer' }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PhishingSimulation />);
    </script>
</body>
</html>
