<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Supabase client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>
    <div class="auto-save-indicator" id="autoSaveIndicator">✓ Auto-saved</div>
    <div class="container">
        <!-- Your HTML structure remains 99% unchanged -->
        <div class="header">
            <h1>⚓ Leverman Logger</h1>
            <p id="currentDateTime"></p>
        </div>

        <div class="tab-navigation">
            <button class="tab active" onclick="showScreen('shift')">Shift Screen</button>
            <button class="tab" onclick="showScreen('delay')">Delay Screen</button>
            <button class="tab" onclick="showScreen('history')">History</button>
        </div>

        <!-- SHIFT SCREEN, DELAY SCREEN, HISTORY SCREEN, MODAL → unchanged -->

        <!-- ... paste your original screen HTML here (shiftScreen, delayScreen, historyScreen, delayWarningModal) ... -->
        <!-- For brevity I'm not repeating it – keep your original markup -->

    </div>

    <script>
        // ────────────────────────────────────────────────
        //  Supabase Config – REPLACE THESE TWO LINES
        // ────────────────────────────────────────────────
        const SUPABASE_URL    = 'https://cjctuhowfhmyazngnrph.supabase.co';
        const SUPABASE_ANON_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqY3R1aG93ZmhteWF6bmducnBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5OTg3NzMsImV4cCI6MjA4NjU3NDc3M30.s3Iapthvnxcc1K99N4P6neM3WvVtz6mVDgPIZAaalFA';

        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ────────────────────────────────────────────────
        //  Globals
        // ────────────────────────────────────────────────
        let currentUser     = null;
        let currentShift    = null;   // now has .id from Supabase
        let currentDelay    = null;
        let shiftHistory    = [];
        let updateIntervals = [];

        // ────────────────────────────────────────────────
        //  Auth + Load on start
        // ────────────────────────────────────────────────
        async function init() {
            // Get or create anonymous session
            let { data: { session }, error } = await supabase.auth.getSession();

            if (!session) {
                const res = await supabase.auth.signInAnonymously();
                if (res.error) {
                    console.error("Anon auth failed", res.error);
                    alert("Cannot connect to cloud storage.\nCheck internet and try again.");
                    return;
                }
                session = res.data.session;
            }

            currentUser = session.user;
            console.log("User ID:", currentUser.id);

            await loadData();
            updateDateTime();
            setInterval(updateDateTime, 1000);
            updateUI();
        }

        // ────────────────────────────────────────────────
        //  Data Layer – Supabase
        // ────────────────────────────────────────────────
        async function loadData() {
            if (!currentUser) return;

            // 1. Try to load active (unfinished) shift
            let { data: active, error: errActive } = await supabase
                .from('leverman_shifts')
                .select('*')
                .eq('user_id', currentUser.id)
                .is('end_time', null)
                .order('created_at', { ascending: false })
                .limit(1);

            if (errActive) console.error("Load active error", errActive);

            if (active?.length > 0) {
                currentShift = active[0];
                // Reconstruct currentDelay if open
                if (currentShift.delays?.length > 0) {
                    const lastDelay = currentShift.delays[currentShift.delays.length - 1];
                    if (!lastDelay.endTime) {
                        currentDelay = {
                            startTime: lastDelay.startTime,
                            reason: lastDelay.reason,
                            reasonSaved: !!lastDelay.reason
                        };
                    }
                }
            }

            // 2. Load recent history (last 60 days)
            const since = new Date(Date.now() - 60*24*60*60*1000).toISOString();

            let { data: history, error: errHist } = await supabase
                .from('leverman_shifts')
                .select('*')
                .eq('user_id', currentUser.id)
                .not('end_time', 'is', null)
                .gte('start_time', since)
                .order('start_time', { ascending: false });

            if (errHist) console.error("Load history error", errHist);
            shiftHistory = history || [];
        }

        async function saveCurrentShift() {
            if (!currentUser || !currentShift) return;

            const payload = {
                user_id:       currentUser.id,
                leverman_name: currentShift.name,
                start_time:    currentShift.startTime,
                start_station: currentShift.startStation,
                delays:        currentShift.delays || [],
                updated_at:    new Date().toISOString(),
            };

            if (currentShift.endTime)    payload.end_time     = currentShift.endTime;
            if (currentShift.stopStation) payload.stop_station = currentShift.stopStation;

            let query;
            if (currentShift.id) {
                // update
                query = supabase
                    .from('leverman_shifts')
                    .update(payload)
                    .eq('id', currentShift.id)
                    .eq('user_id', currentUser.id);
            } else {
                // insert new
                query = supabase
                    .from('leverman_shifts')
                    .insert(payload)
                    .select()
                    .single();
            }

            const { data, error } = await query;

            if (error) {
                console.error("Save failed", error);
                alert("Could not save to cloud. Check connection.");
                return;
            }

            if (!currentShift.id) currentShift.id = data.id;

            showAutoSave();
        }

        // ────────────────────────────────────────────────
        //  Your original helper functions (mostly unchanged)
        // ────────────────────────────────────────────────
        function updateDateTime() {
            const now = new Date();
            document.getElementById('currentDateTime').textContent = 
                now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) +
                ' - ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        }

        function formatTime(date) {
            return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        }

        function formatTimeWithDate(date) {
            return date.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function formatDuration(ms) {
            const totalMinutes = Math.floor(ms / 60000);
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            return hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
        }

        // showScreen, updateUI, displayHistory, displayPreviousShift → keep your original versions
        // (they read from currentShift / shiftHistory which now come from Supabase)

        // ────────────────────────────────────────────────
        //  Event listeners – adapted for Supabase
        // ────────────────────────────────────────────────

        // Start shift
        document.getElementById('startShiftBtn').addEventListener('click', async () => {
            const name = document.getElementById('levermanName').value.trim();
            const s1 = document.getElementById('startStationNum1').value.trim();
            const s2 = document.getElementById('startStationNum2').value.trim();
            const station = s1 + '+' + s2;

            currentShift = {
                id: null,
                name,
                startTime: new Date().toISOString(),
                startStation: station,
                delays: []
            };

            await saveCurrentShift();
            updateUI();

            // clear form
            document.getElementById('levermanName').value = '';
            document.getElementById('startStationNum1').value = '';
            document.getElementById('startStationNum2').value = '';
            validateShiftStart();
        });

        // End shift (simplified – always ends open delay)
        document.getElementById('endShiftBtn').addEventListener('click', async () => {
            const s1 = document.getElementById('stopStationNum1').value.trim();
            const s2 = document.getElementById('stopStationNum2').value.trim();
            const stopStation = s1 + '+' + s2;

            const now = new Date().toISOString();

            if (currentDelay?.reasonSaved) {
                currentShift.delays.push({
                    startTime: currentDelay.startTime,
                    endTime: now,
                    reason: currentDelay.reason
                });
                currentDelay = null;
            }

            currentShift.endTime = now;
            currentShift.stopStation = stopStation;

            await saveCurrentShift();

            // Move to history
            shiftHistory.unshift({ ...currentShift });
            currentShift = null;

            // Auto export (your original logic)
            autoExportShift(shiftHistory[0]);

            updateUI();

            document.getElementById('stopStationNum1').value = '';
            document.getElementById('stopStationNum2').value = '';
        });

        // Start / End delay – similar pattern: modify currentShift.delays → saveCurrentShift()

        document.getElementById('startDelayBtn').addEventListener('click', () => {
            currentDelay = {
                startTime: new Date().toISOString(),
                reason: null,
                reasonSaved: false
            };
            updateUI();
        });

        // ... rest of delay reason / save / end logic – call saveCurrentShift() after changes ...

        // Keep your auto-save indicator, showScreen, etc.

        // Kick off
        init().catch(console.error);
    </script>
</body>
</html>
